[project]
name = "predicting-electric-vehicle-purchases"
version = "0.1.0"
description = "Machine learning project predicting electric vehicle purchases"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5.0",
    "nbstripout>=0.7.0",
    "ruff>=0.4.0",
    "jupyterlab>=4.0.0",
    "ipykernel>=6.25.0",
    "nbdime>=4.0.0",
]

[tool.ruff]
# Target Python version
target-version = "py310"
line-length = 88
indent-width = 4

# Include both Python scripts and Jupyter Notebooks
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (automatic import sorting)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # Line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
# In notebooks, allow unused imports and non-top-level imports for interactive analysis
"*.ipynb" = ["F401", "E402", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
