name: CI - Code Quality & Notebook Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff & nbstripout
        run: |
          python -m pip install --upgrade pip
          pip install ruff nbstripout

      - name: Run Ruff Linter
        run: |
          ruff check .

      - name: Run Ruff Formatter Check
        run: |
          ruff format --check .

      - name: Check Jupyter Notebooks are Clean (Outputs Stripped)
        run: |
          # Verify that nbstripout does not detect any unstripped outputs
          nbstripout --is-stripped notebook/*.ipynb
